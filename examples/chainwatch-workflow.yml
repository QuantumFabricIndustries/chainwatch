# Example workflow for projects that use ChainWatch. Copy it to .github/workflows/
# in your own repo. It lives here, not in this repo's workflows, because it
# references the published action rather than this checkout.

name: Supply Chain Scan

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  security-events: write   # required for SARIF upload

jobs:
  chainwatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ChainWatch supply chain scan
        uses: QuantumFabricIndustries/chainwatch@master
        with:
          severity: medium
          fail-on: high
          upload-sarif: true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: chainwatch-results.sarif

