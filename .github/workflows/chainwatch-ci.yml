name: ChainWatch Self-Scan

on: [push, pull_request]

jobs:
  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: ChainWatch supply chain scan
        uses: ./action
        with:
          severity: medium
          fail-on: high
          install-command: ''
          sarif-output: chainwatch-results.sarif
          # The next step uploads; uploading twice in one run is rejected.
          upload-sarif: 'false'
          # Test fixtures are fake malware on purpose; esbuild's postinstall
          # downloads its binary and vite reads .env files by design.
          allow-packages: fake-worm, fake-drift-pkg, esbuild, vite
      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: chainwatch-results.sarif

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # CLI tests run the built dist/cli/index.js.
      - run: npm run build
      - run: npm test
      - name: Server tests
        working-directory: server
        run: |
          npm ci
          npm test
